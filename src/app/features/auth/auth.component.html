<section class="shell">
  <div class="gate">
    <h1>{{ mode() === 'login' ? copy.signIn : copy.createPass }}</h1>
    <p class="intro">{{ copy.intro }}</p>

    @if (!backend.isOnline()) {
      <p class="offline fine">{{ copy.offline }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (mode() === 'register') {
        <label>
          <span class="label">{{ copy.displayName }}</span>
          <input formControlName="displayName" type="text" autocomplete="nickname" />
        </label>
      }

      <label>
        <span class="label">{{ copy.email }}</span>
        <input formControlName="email" type="email" autocomplete="email" />
        @if (showError('email')) {
          <span class="error mono">{{ copy.emailError }}</span>
        }
      </label>

      <label>
        <span class="label">{{ copy.password }}</span>
        <input
          formControlName="password"
          type="password"
          [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        />
        @if (showError('password')) {
          <span class="error mono">{{ copy.passwordError }}</span>
        }
      </label>

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? copy.working : mode() === 'login' ? copy.signIn : copy.register }}
      </button>
    </form>

    <button type="button" class="switch" (click)="toggle()">
      {{ mode() === 'login' ? copy.noPass : copy.hasPass }}
    </button>
  </div>
</section>
