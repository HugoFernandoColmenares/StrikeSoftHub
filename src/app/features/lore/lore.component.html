<section class="shell" appAccentZone="#10b981">
  <div class="sport">
    <header class="head">
      <h1>The sport</h1>
      <p class="intro">
        Everything a first-time visitor asks before walking on to the field, answered plainly.
      </p>
    </header>

    <dl class="answers">
      @for (item of answers; track item.question) {
        <div>
          <dt>{{ item.question }}</dt>
          <dd>{{ item.body }}</dd>
        </div>
      }
    </dl>

    <aside class="contact">
      <p>Still unsure? Ask before Sunday.</p>
      <a [href]="group.instagramUrl" target="_blank" rel="noopener noreferrer" class="btn-primary">
        <app-icon name="instagram" [size]="1" />
        {{ group.instagramHandle }}
      </a>
    </aside>
  </div>
</section>
