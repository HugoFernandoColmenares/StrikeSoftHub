<section class="shell" appAccentZone="#72c68b">
  <div class="sport">
    <header class="head">
      <h1>{{ copy.title }}</h1>
      <p class="intro">{{ copy.intro }}</p>
    </header>

    <dl class="answers">
      @for (item of copy.answers; track item.question) {
        <div>
          <dt>{{ item.question }}</dt>
          <dd>{{ item.body }}</dd>
        </div>
      }
    </dl>

    <aside class="contact">
      <p>{{ copy.ask }}</p>
      <a [href]="group.instagramUrl" target="_blank" rel="noopener noreferrer" class="btn-primary">
        <app-icon name="instagram" [size]="2" />
        {{ group.instagramHandle }}
      </a>
    </aside>
  </div>
</section>
