<section class="catalog">
  <header>
    <h1>The Armory</h1>
    <p>Filter by combat role and weapon class. Low stock pieces glow first in the mind, not the page.</p>
  </header>

  <aside class="filters">
    <fieldset>
      <legend>Combat Role</legend>
      @for (option of roles; track option) {
        <button type="button" [class.active]="role() === option" (click)="role.set(option)">
          {{ option }}
        </button>
      }
    </fieldset>
    <fieldset>
      <legend>Class</legend>
      @for (option of classes; track option) {
        <button type="button" [class.active]="weaponClass() === option" (click)="weaponClass.set(option)">
          {{ option }}
        </button>
      }
    </fieldset>
  </aside>

  @if (loading()) {
    <app-loot-spinner />
  } @else {
    <div class="arena-grid">
      @for (weapon of filtered(); track weapon.id) {
        <app-weapon-card [weapon]="weapon" />
      }
    </div>
  }
</section>
