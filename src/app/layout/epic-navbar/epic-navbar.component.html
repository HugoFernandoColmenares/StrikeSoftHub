<header class="topbar">
  <div class="topbar__inner">
    <a routerLink="/" class="brand" (click)="closeMenu()" aria-label="Armagedon home">
      <span class="brand__sigil" aria-hidden="true">A</span>
      <span class="brand__text">
        <span class="brand__name">ARMAGEDON</span>
        <span class="brand__tagline">Forge • Battle • Legend</span>
      </span>
    </a>

    <nav
      id="mainNav"
      class="nav-links"
      [class.is-open]="menuOpen()"
      aria-label="Primary"
    >
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>
      <a class="nav-link" routerLink="/armory" routerLinkActive="is-active" (click)="closeMenu()">
        Shop
      </a>
      <a class="nav-link" routerLink="/arena" routerLinkActive="is-active" (click)="closeMenu()">
        Events
      </a>
      <a class="nav-link" routerLink="/lore" routerLinkActive="is-active" (click)="closeMenu()">
        About
      </a>
      <a class="nav-link" routerLink="/auth" routerLinkActive="is-active" (click)="closeMenu()">
        Admin / Publish
      </a>
    </nav>

    <div class="topbar__actions">
      <div class="login-status">
        <span class="status-dot" [class.is-online]="backend.isOnline()" aria-hidden="true"></span>
        <span>{{ auth.isAuthenticated() ? auth.currentUser()?.displayName : 'Guest' }}</span>
      </div>

      <a routerLink="/profile" class="icon-button account" (click)="closeMenu()" [attr.aria-label]="auth.isAuthenticated() ? 'Open profile' : 'Sign in'">
        <app-icon name="user" [size]="2" />
      </a>

      <button
        class="icon-button cart-button"
        type="button"
        aria-label="Open cart"
        [attr.aria-expanded]="cart.drawerOpen()"
        (click)="openCart()"
      >
        <app-icon name="bag" [size]="2" />
        <span class="cart-badge" aria-live="polite">{{ cart.count() }}</span>
      </button>

      <button
        class="hamburger"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mainNav"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
