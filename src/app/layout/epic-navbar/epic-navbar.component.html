<header class="topbar">
  <div class="topbar__inner">
    <a routerLink="/" class="brand" (click)="closeMenu()" [attr.aria-label]="copy.brandAria">
      <img
        class="brand__logo"
        [src]="group.logoUrl"
        alt=""
        width="64"
        height="80"
        aria-hidden="true"
      />
      <span class="brand__text">
        <span class="brand__name">{{ copy.brandName }}</span>
        <span class="brand__tagline">{{ copy.brandTagline }}</span>
      </span>
    </a>

    <nav
      id="mainNav"
      class="nav-links"
      [class.is-open]="menuOpen()"
      aria-label="Principal"
      [attr.inert]="compactNav() && !menuOpen() ? '' : null"
    >
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        {{ copy.nav.home }}
      </a>
      <a class="nav-link" routerLink="/armory" routerLinkActive="is-active" (click)="closeMenu()">
        {{ copy.nav.shop }}
      </a>
      <a class="nav-link" routerLink="/arena" routerLinkActive="is-active" (click)="closeMenu()">
        {{ copy.nav.events }}
      </a>
      <a class="nav-link" routerLink="/lore" routerLinkActive="is-active" (click)="closeMenu()">
        {{ copy.nav.about }}
      </a>
    </nav>

    <div class="topbar__actions">
      <button
        class="icon-button cart-button"
        type="button"
        [attr.aria-label]="copy.openCart"
        [attr.aria-expanded]="cart.drawerOpen()"
        (click)="openCart()"
      >
        <app-icon name="bag" [size]="2" />
        <span class="cart-badge" aria-live="polite">{{ cart.count() }}</span>
      </button>

      <button
        class="hamburger"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mainNav"
        [attr.aria-label]="menuOpen() ? copy.closeMenu : copy.openMenu"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
